<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style1.css">
</head>

<body>

<img src="/images/CNRL.png" class="anime-popup" />

<header>
    Create Your Account on SENTiDeX
</header>

<div class="container">

    <div class="card">
        <h2>Register ✨</h2>

        <!-- FORM -->
        <form action="/customUser/register" method="post" onsubmit="handleSubmit(this)">

            <!-- USERNAME -->
            <div class="input-group">
                <input type="text" name="username" required>
                <label>Username</label>
            </div>

            <!-- EMAIL -->
            <div class="input-group">
                <input type="email" name="email" required>
                <label>Email</label>
            </div>

            <!-- PASSWORD -->
            <div class="input-group">
                <input type="password" name="password" required>
                <label>Password</label>
            </div>

            <!-- BUTTON -->
            <button type="submit" id="registerBtn">
                Register
            </button>

        </form>

        <br>

        <!-- LOGIN LINK -->
        <div class="redirect-text">
            <p>Already have an account?</p>
            <a href="/login">Login 🔐</a>
        </div>

    </div>

</div>

<footer>
    <p>Join the SENTiDeX App • Secure & Private</p>
</footer>

<!-- SCRIPT -->
<script>
    function handleSubmit(form) {
        const btn = document.getElementById("registerBtn");

        btn.innerText = "Creating...";
        btn.disabled = true;

        // allow form to continue submitting
        return true;
    }
</script>

</body>
</html>
