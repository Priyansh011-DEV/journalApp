<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style2.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>


<!-- AI BUTTON -->
<div id="aiButton" onclick="toggleChat()">✨ AI Companion ✨</div>
<div id="aiBubble">Start your AI chat 💬</div>

<!-- CHAT -->
<div id="chatContainer">
    <div class="chat-header">AI Companion</div>
    <div id="chatBox"></div>

    <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Talk to me...">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<img src="/images/walk.png" class="anime-popup" />

<header>
    <h1 id="welcomeText">Welcome Back Traveller 😊</h1>

    <div class="header-actions">
        <a href="/info"><button class="info-btn">Info🪧</button></a>
        <button id="logoutBtn">Logout</button>
        <button id="deleteUserBtn" class="danger">Delete Account</button>
        <a href="/RESET1"><button>Reset Password</button></a>
    </div>
</header>

<div class="container">

    <!-- LEFT -->
    <div class="left">
        <div class="card">
            <h2>📊 Dashboard</h2>
            <p id="todayDate"></p>
            <div class="calendar-wrapper">
                <div id="calendar"></div>
                <img src="/images/cnrollcalen.png" class="calendar-img" />
            </div>
        </div>
    </div>

    <!-- MIDDLE -->
    <div class="middle">

        <div class="card small-card">
            <h3>😊 Mood Today</h3>
            <p id="moodText">Loading...</p>
        </div>

        <div class="card small-card">
            <h3>⏰ Time</h3>
            <p id="clock"></p>
        </div>

        <div class="card small-card">
            <h3>🎧 Chill Music</h3>

            <select id="musicSelect">
                <option value="/music/song1.mp3">music 1</option>
                <option value="/music/song2.mp3">music 2</option>
                <option value="/music/song3.mp3">music 3</option>
                <option value="/music/song4.mp3">music 4</option>
                <option value="/music/song5.mp3">music 5</option>
                <option value="/music/song6.mp3">music 6</option>
                <option value="/music/song7.mp3">music 7</option>
            </select>

            <button id="musicToggleBtn">Play / Pause</button>
            <audio id="audioPlayer" loop></audio>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="card">
            <h2>Create Journal Entry</h2>

            <form id="journalForm">
                <input type="text" id="title" placeholder="Title" required />
                <textarea id="content" placeholder="Write something..." required></textarea>
                <button type="submit">Save Journal</button>
            </form>
        </div>

        <div class="card center">
            <h3>📚 Your Journals</h3>
            <button id="viewJournalsBtn" class="view-btn">
                View All Journals →
            </button>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>

function handleRateLimit(res) {
    if (res.status === 429) {
        alert("Too many actions 😅 Slow down!");
        return true;
    }
    return false;
}

flatpickr("#calendar", { inline: true, defaultDate: "today" });

document.getElementById("todayDate").innerText =
    "Today: " + new Date().toDateString();

setInterval(() => {
    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString();
}, 1000);

// 🔥 MUSIC FIX START
const player = document.getElementById("audioPlayer");
const select = document.getElementById("musicSelect");

// preload song (no autoplay)
window.addEventListener("DOMContentLoaded", () => {
    player.src = select.value;
    player.load();
});

document.getElementById("musicSelect").onchange = e => {
    player.src = e.target.value;
    player.load();
    player.play();
};

document.getElementById("musicToggleBtn").onclick = () => {
    if (player.paused) {
        player.play().catch(() => {
            console.log("Play blocked until user interaction");
        });
    } else {
        player.pause();
    }
};
// 🔥 MUSIC FIX END

async function loadMood() {
    try {
        const res = await fetch("/journal/mood");
        document.getElementById("moodText").innerText = await res.text();
    } catch {
        document.getElementById("moodText").innerText = "normal";
    }
}

document.getElementById("journalForm").addEventListener("submit", async e => {
    e.preventDefault();

    const titleInput = document.getElementById("title");
    const contentInput = document.getElementById("content");

    const res = await fetch("/journal", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            title: titleInput.value,
            content: contentInput.value
        })
    });

    if (handleRateLimit(res)) return;

    if (res.ok) {
        titleInput.value = "";
        contentInput.value = "";
        loadMood();
        alert("Journal added ✨");
    } else {
        alert("Error saving journal ❌");
    }
});

document.getElementById("viewJournalsBtn").onclick = () => location.href = "/journals";
document.getElementById("logoutBtn").onclick = () => location.href = "/logout";

document.getElementById("deleteUserBtn").onclick = async () => {
    if (!confirm("Are you sure?")) return;
    await fetch("/Webuser", { method: "DELETE" });
    location.href = "/login";
};

function toggleChat() {
    const container = document.getElementById("chatContainer");
    container.style.display =
        container.style.display === "flex" ? "none" : "flex";

    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML = "";

    addMessage(`Welcome back, ${localStorage.getItem("username") || "Traveller"} 👋`, "bot");
}

async function sendMessage() {
    const chatInput = document.getElementById("chatInput");
    const msg = chatInput.value.trim();
    if (!msg) return;

    addMessage(msg, "user");
    const typing = addMessage("...", "bot");

    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message: msg,
                username: localStorage.getItem("username")
            })
        });

        if (handleRateLimit(res)) {
            typing.innerText = "Slow down 😅";
            return;
        }

        typing.innerText = await res.text();
    } catch {
        typing.innerText = "Server error ❌";
    }

    chatInput.value = "";
}

function addMessage(text, sender) {
    const chatBox = document.getElementById("chatBox");

    const m = document.createElement("div");
    m.className = "chat-message " + sender;
    m.innerText = text;

    chatBox.appendChild(m);
    chatBox.scrollTop = chatBox.scrollHeight;

    return m;
}

window.onload = () => {
    const stored = localStorage.getItem("username");
    const username = (stored && stored !== "null") ? stored : "Traveller";

    document.getElementById("welcomeText").innerText =
        `Welcome back, ${username} 😊`;

    loadMood();

    const bubble = document.getElementById("aiBubble");

    // show bubble
    setTimeout(() => {
        bubble.style.opacity = "1";
        bubble.style.transform = "translateY(0)";
    }, 500);

    // hide bubble
    setTimeout(() => {
        bubble.style.opacity = "0";
        bubble.style.transform = "translateY(10px)";
    }, 4000);
};



</script>

</body>
</html>
