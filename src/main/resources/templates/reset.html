<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style3.css">
</head>

<body>

<img src="/images/BUNNYSKT.png" class="anime-popup" />

<div class="reset-container">

    <!-- STEP 1 -->
    <div class="reset-card">
        <h3>Step 1: Request Reset Token</h3>

        <input type="text" id="username" placeholder="Enter Username">
        <button onclick="getToken()">Send Token to Email</button>
    </div>

    <!-- STEP 2 -->
    <div class="reset-card">
        <h3>Step 2: Reset Password</h3>

        <input type="text" id="token" placeholder="Enter Token">
        <input type="password" id="newPassword" placeholder="New Password">

        <button onclick="resetPassword()">Reset Password</button>
    </div>

    <!-- FOOTER -->
    <div class="reset-footer">
        <p>For queries: support.inc.japp@gmail.com</p>
        <a href="https://forms.gle/9cewy9FHWzKHBFWj8" target="_blank">
            <button class="feedback-btn">Give Feedback</button>
        </a>
    </div>

</div>

<script>

    // STEP 1: REQUEST TOKEN
    async function getToken() {
        const username = document.getElementById("username").value;

        const res = await fetch("/ResetPassword/Forgot", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username })
        });

        const text = await res.text();
        alert(text);
    }

    // STEP 2: RESET PASSWORD
    async function resetPassword() {
        const token = document.getElementById("token").value;
        const password = document.getElementById("newPassword").value;

        const res = await fetch(`/ResetPassword/Reset?token=${token}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ password })
        });

        const text = await res.text();

        if (res.ok) {
            alert("Password reset successful 🔥");
            window.location.href = "/login";
        } else {
            alert(text);
        }
    }


    

</script>

</body>
</html>
