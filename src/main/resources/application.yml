spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: journalDB
      auto-index-creation: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


server:
  port: ${PORT:8080}
  #servlet:
   # context-path: /Journal

#logging:
 # level:
  #  root: DEBUG
   # org.springdoc: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.boot.autoconfigure.mail: DEBUG