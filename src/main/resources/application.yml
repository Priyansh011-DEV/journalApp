spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: journalDB
      auto-index-creation: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

server:
  port: ${PORT:8080}
  #servlet:
   # context-path: /Journal

#logging:
 # level:
  #  root: DEBUG
   # org.springdoc: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health

